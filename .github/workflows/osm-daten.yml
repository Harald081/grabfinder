name: Friedhofsdaten aktualisieren (OpenStreetMap)

on:
  push:
    branches: [main]
    paths:
      - tools/osm_export.py
      - .github/workflows/osm-daten.yml
  schedule:
    - cron: '17 3 * * 1'   # jeden Montag früh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-daten
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Daten von OpenStreetMap holen
        run: python3 tools/osm_export.py data
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten: OpenStreetMap-Export aktualisiert"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
